name: PR Security Gate

# Fast security checks that must pass before any PR can be merged.
# Designed to complete in < 3 minutes so developers get fast feedback.

on:
  pull_request:
    branches: ["main", "develop", "release/*"]
    types: [opened, synchronize, reopened]

jobs:
  # ─────────────────────────────────────────────
  # Quick secret scan on changed files only
  # ─────────────────────────────────────────────
  quick-secret-scan:
    name: 🔑 Quick Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan only changed files
        run: |
          pip install detect-secrets
          git diff origin/${{ github.base_ref }}...HEAD --name-only | \
            xargs detect-secrets scan --no-verify 2>/dev/null | \
            python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          results = data.get('results', {})
          if results:
              print('❌ Potential secrets detected in changed files:')
              for file, findings in results.items():
                  for f in findings:
                      print(f'  {file}:{f[\"line_number\"]} — {f[\"type\"]}')
              sys.exit(1)
          else:
              print('✅ No secrets detected in changed files')
          "

  # ─────────────────────────────────────────────
  # SAST on changed files only (faster than full scan)
  # ─────────────────────────────────────────────
  quick-sast:
    name: 🔍 Quick SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep on changed files only
        run: |
          # Get list of changed source files
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '\.(js|ts|py|go|rs)$' || true)

          if [ -z "$CHANGED" ]; then
            echo "✅ No source files changed, skipping SAST"
            exit 0
          fi

          echo "Scanning changed files: $CHANGED"
          semgrep \
            --config "p/owasp-top-ten" \
            --config "p/nodejs" \
            --config "p/typescript" \
            --config "p/sql-injection" \
            --config "p/xss" \
            --error \
            --json \
            $CHANGED | tee semgrep-pr.json

          # Parse results
          python3 -c "
          import json, sys
          with open('semgrep-pr.json') as f:
              data = json.load(f)
          results = data.get('results', [])
          if results:
              print(f'❌ {len(results)} security issue(s) found:')
              for r in results[:10]:
                  sev = r['extra']['severity']
                  msg = r['extra']['message'][:80]
                  path = r['path']
                  line = r['start']['line']
                  print(f'  [{sev}] {path}:{line} — {msg}')
              sys.exit(1)
          else:
              print('✅ No security issues found in changed files')
          "

  # ─────────────────────────────────────────────
  # npm audit on package-lock.json changes
  # ─────────────────────────────────────────────
  quick-dep-audit:
    name: 📦 Quick Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if package-lock.json changed
        id: check-lockfile
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E '(package-lock\.json|requirements.*\.txt|go\.sum)' || true)
          if [ -z "$CHANGED" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "Changed dependency files: $CHANGED"
          fi

      - name: Setup Node.js
        if: steps.check-lockfile.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit
        if: steps.check-lockfile.outputs.skip == 'false'
        run: |
          npm ci
          npm audit --audit-level=high
          echo "✅ No high/critical dependency vulnerabilities"

      - name: Skip message
        if: steps.check-lockfile.outputs.skip == 'true'
        run: echo "✅ No dependency files changed, skipping audit"

  # ─────────────────────────────────────────────
  # PR comment with security gate status
  # ─────────────────────────────────────────────
  pr-comment:
    name: 💬 PR Security Status
    runs-on: ubuntu-latest
    needs: [quick-secret-scan, quick-sast, quick-dep-audit]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post security status comment
        uses: actions/github-script@v7
        with:
          script: |
            const secretResult = '${{ needs.quick-secret-scan.result }}';
            const sastResult = '${{ needs.quick-sast.result }}';
            const depResult = '${{ needs.quick-dep-audit.result }}';

            const icon = (r) => r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const allPassed = [secretResult, sastResult, depResult]
              .every(r => r === 'success' || r === 'skipped');

            const body = `## 🔐 PR Security Gate

            | Check | Status |
            |-------|--------|
            | Secret Scan | ${icon(secretResult)} ${secretResult} |
            | SAST (Semgrep) | ${icon(sastResult)} ${sastResult} |
            | Dependency Audit | ${icon(depResult)} ${depResult} |

            ${allPassed
              ? '### ✅ All security gates passed — safe to review and merge.'
              : '### ❌ One or more security gates failed. Please review the checks above before merging.'}

            > Commit: \`${{ github.event.pull_request.head.sha }}\``;

            // Find existing comment to update instead of creating new ones
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('PR Security Gate')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }