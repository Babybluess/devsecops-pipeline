name: CodeQL Analysis

# GitHub's own static analysis engine — deeper than Semgrep
# for certain vulnerability classes. Free for public repos.
# Requires GitHub Advanced Security for private repos.

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 6 * * 3" # Every Wednesday 06:00 UTC

jobs:
  codeql:
    name: 🔬 CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
        # Add "go" if you have Go code
        # Add "java" if applicable

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          # security-extended adds extra queries beyond the default set

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: codeql-results
          upload: true